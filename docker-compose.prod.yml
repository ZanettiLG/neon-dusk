# Production stack — /opt/neon-dusk/docker-compose.prod.yml on the VPS.
# Secrets come from .env.production (env_file for containers, --env-file for
# compose variable interpolation, e.g. IMAGE_TAG for rollback).
services:
  postgres:
    image: postgres:16-alpine
    container_name: neondusk-db
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - neondusk

  redis:
    image: redis:7-alpine
    container_name: neondusk-cache
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neondusk

  server:
    image: ghcr.io/zan-ia/neon-dusk-server:${IMAGE_TAG:-latest}
    container_name: neondusk-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - neondusk
    # No host ports — only reachable via the internal network (nginx proxies /api)

  app:
    image: ghcr.io/zan-ia/neon-dusk-app:${IMAGE_TAG:-latest}
    container_name: neondusk-app
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    healthcheck:
      # busybox wget (nginx:alpine) — no --spider, so fetch and discard
      test: ["CMD-SHELL", "wget -q -O- http://localhost/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - neondusk

  # ND-007/ND-018: telemetry — Prometheus scrapes the server container's
  # /metrics over the internal network and evaluates alerts.yml (same image
  # and config layout as docker-compose.yml). The prod config targets the
  # in-network server hostname directly (Prometheus does no env-substitution
  # on scrape targets, so a separate config file is used instead of an env).
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: neondusk-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    depends_on:
      - server
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - neondusk

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  prometheus_data:
    driver: local

networks:
  neondusk:
    driver: bridge
