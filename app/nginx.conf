server {
    listen 80;
    server_name _;

    # Security headers — inherited by locations that don't override add_header
    # (/ and /api/, i.e. HTML and API responses). Hashed /assets/, /sw.js and
    # workbox files set their own add_header Cache-Control, which nginx treats
    # as a replacement; they carry no user content, so omitting the headers
    # there is intentional.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.neondusk.io; img-src 'self' data:; font-src 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy to the backend container (internal Docker network)
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Hashed static assets (vite emits content-hashed filenames) — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA service worker — never cache (must always check for updates)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires 0;
    }

    # PWA precache workbox runtime (workbox-<hash>.js) — never cache
    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        expires 0;
    }

    # SPA fallback: all other routes -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
