name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Terminology guard (IP)
        run: node scripts/check-terminologia.mjs

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  test:
    name: Test
    needs: [lint, typecheck]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      # Match server/src/__tests__/setup.ts and docker-compose.test.yml ports.
      # Test credentials are ephemeral and localhost-only — no secrets needed.
      DATABASE_URL: postgres://neondusk:neondusk_dev@localhost:55432/neondusk
      REDIS_URL: redis://localhost:56379
      NODE_ENV: test
      # env.ts requires >=32 chars for both JWT secrets (db:migrate validates env)
      JWT_SECRET: ci-test-jwt-secret-32-chars-minimum-length-0000
      JWT_REFRESH_SECRET: ci-test-refresh-secret-32-chars-minimum-0000
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start test infrastructure
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run database seeds
        run: npm run db:seed

      - name: Run tests
        run: npm run test

      - name: Teardown test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  build:
    name: Build
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
