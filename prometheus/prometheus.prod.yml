# ND-007: Prometheus scrape config for the Neon Dusk server (production).
# Prod: the server container (neondusk-server) is on the internal compose
# network (docker-compose.prod.yml), so the scrape target is the in-network
# hostname.
# NOTE: Prometheus config does NOT expand ${VAR:-default} — env-substitution
# exists only for external_labels — so scrape targets are hardcoded.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# ND-018: alerting rules (see alerts.yml).
rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "neondusk"
    metrics_path: /metrics
    static_configs:
      - targets: ["neondusk-server:3000"]
